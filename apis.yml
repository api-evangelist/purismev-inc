name: PurismEV Inc.
description: PurismEV Inc. is an AI-driven electric-vehicle energy optimization platform
  that processes real-time vehicle data to help fleets, OEMs, leasing companies, and
  operators reduce energy consumption, extend battery lifespan, and lower operating
  costs. Its products include Smart Throttle Control technology (range extension),
  Battery-Aware Smart Charging, a Smart Mobility energy management system (EMS), and
  a Fleet Management Dashboard for real-time monitoring across cars, delivery trucks,
  forklifts, scooters, and drones. PurismEV is backed by 500 Global. The company
  publishes no public developer API, SDKs, or developer documentation at this time.
